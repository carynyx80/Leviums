[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120

# BNB Smart Chain mainnet only (chainId 56). No testnet entries.
[rpc_endpoints]
bsc = "https://bsc-dataseed.binance.org"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
